# DUATF assessment question bank: one question per control in the framework.
# Status: DRAFT for legal SME review. Each question is answered Yes / Partial / No / Not applicable.
# References, applicability, risk weight and evidence suggestions are derived from the knowledge
# base when a release is built (pnpm kb:release); only the wording below is authored here.
version: 1
questions:
  # D01 Governance & accountability
  - control: CTL-GOV-01
    question: Has management (or the Board) approved a DPDP programme charter that names an accountable executive and the DPO or privacy lead, with a RACI across business, IT, legal and security?
    recommendation: Draft a DPDP programme charter covering scope, the accountable executive, the DPO or privacy lead and a RACI; obtain Board or management approval and review it annually.
  - control: CTL-GOV-02
    question: Does the organisation maintain a version-controlled data protection policy suite (internal privacy, retention, rights handling, breach, vendor privacy and children's data) reviewed at least annually?
    recommendation: Publish the missing policies, place the suite under document control with owners and effective dates, and schedule an annual review.
  - control: CTL-GOV-03
    question: Is a DPO (for a Significant Data Fiduciary) or a person able to answer on the organisation's behalf designated, and are their business contact details published on the website or app, in notices and in rights responses?
    recommendation: Designate the contact person (or DPO), publish their business contact details prominently on the website or app, and include them in every notice and rights response template.
  - control: CTL-GOV-04
    question: Do all staff receive privacy training at induction and annually, with role-based modules for front-line collection, call centre, HR, developers and marketing?
    recommendation: Roll out induction and annual DPDP awareness training, add role-based modules for high-risk roles, and track completion rates.
  - control: CTL-GOV-05
    question: Must new or changed processes, products, systems and vendors pass a privacy review (a mini-DPIA) before go-live?
    recommendation: Add a mandatory privacy review gate to the change and SDLC process, with a short impact questionnaire and DPO sign-off before go-live.
  - control: CTL-GOV-06
    question: Does management or the Board receive privacy reporting at least quarterly (readiness, open findings, rights SLAs, breaches and vendor coverage)?
    recommendation: Define privacy KPIs and report them to management or the Board every quarter, with actions tracked to closure.
  - control: CTL-GOV-07
    question: Is every processing purpose screened by legal to confirm that it is lawful (not expressly forbidden by law) and has a basis (consent or a legitimate use under s.7)?
    recommendation: Introduce a legal screening step for every purpose, recording that it is not forbidden by law and naming its basis; re-screen when purposes change.

  # D02 Scope & applicability
  - control: CTL-SCP-01
    question: Has the organisation documented its DPDP applicability (s.3), its roles, SDF likelihood, Third Schedule status, exposure to children and persons with disabilities, and its sector regulators, and is this refreshed annually or on business change?
    recommendation: Complete a documented applicability and entity-profile assessment, have it approved, and refresh it annually or whenever the business changes.
  - control: CTL-SCP-02
    question: For each processing activity and each third-party relationship, is the organisation's role (Data Fiduciary, Data Processor or joint Data Fiduciary) recorded with a rationale?
    recommendation: Record the role determination and its rationale for every activity and third-party relationship, and reflect it in contracts.
  - control: CTL-SCP-03
    question: Does the organisation keep a register of every reliance on s.7, s.17 or Fourth Schedule exemptions, with the clause, scope, residual obligations, legal owner and review date?
    recommendation: Build an exemption register, justify each entry with the specific clause and scope, assign a legal owner and set review dates.
  - control: CTL-SCP-04
    question: Are MeitY and Data Protection Board notifications, sector regulator changes and CERT-In directions tracked, with an impact assessment completed within 30 days?
    recommendation: Assign regulatory change monitoring to a named owner, log each change, and complete and act on an impact assessment within 30 days.

  # D03 Data mapping
  - control: CTL-MAP-01
    question: Is there a record of processing activities that links each department, process and activity to its purposes, basis, data elements, systems, recipients, transfers and retention?
    recommendation: Build the processing register (RoPA) at activity level, linking purposes, bases, data elements, systems, recipients, transfers and retention, and keep it current through the change process.
  - control: CTL-MAP-02
    question: Are there level-1 data flow diagrams for each process showing entry channels, digitisation points, systems, internal and external recipients and cross-border hops?
    recommendation: Draw level-1 data flows for each in-scope process, including paper-to-digital points and cross-border hops, and review them yearly.
  - control: CTL-MAP-03
    question: Does the organisation discover personal data across databases, file shares, email, SaaS and endpoints, including spreadsheets, messaging apps and shadow IT?
    recommendation: Run data discovery scans across structured and unstructured stores, bring the shadow data found into the register, and repeat the scans periodically.
  - control: CTL-MAP-04
    question: Is there a standard catalogue of data elements with categories and context flags (health, financial, biometric, children, government ID)?
    recommendation: Adopt a data element catalogue with categories and context flags and use it consistently in the register, notices and forms.

  # D04 Lawful basis & purpose
  - control: CTL-LB-01
    question: Is every purpose recorded with its basis (consent or a specific s.7 clause), with a justification memo for each reliance on s.7?
    recommendation: Record a basis for every purpose in the purpose register and write a justification memo for each s.7 reliance.
  - control: CTL-LB-02
    question: Has a field-by-field necessity review of forms, APIs and system fields been done against each purpose, and are unnecessary fields removed?
    recommendation: Review each form, API and system field against its purpose, remove what is not necessary, and repeat the review on change.
  - control: CTL-LB-03
    question: Does the HR purpose register separate employment purposes under s.7(i) from consent-based purposes (for example wellness programmes, marketing or photos on social media)?
    recommendation: Split HR purposes into s.7(i) employment purposes and consent-based purposes, and obtain separate consent for the latter.
  - control: CTL-LB-04
    question: Does any new use of existing personal data (analytics, AI training, cross-selling, sharing within the group) require a purpose-compatibility review and, where needed, a new basis?
    recommendation: Require a documented compatibility review before any repurposing and obtain a fresh basis (usually new consent) where the new use is not covered.

  # D05 Notice
  - control: CTL-NOT-01
    question: Is there a Rule 3 notice standard with a master template (standalone, itemised data and purposes, goods or services, how to withdraw consent, exercise rights and complain to the Board) and variants for every channel?
    recommendation: Adopt a Rule 3 master notice template and produce variants for web, app, paper, IVR, branch and field channels.
  - control: CTL-NOT-02
    question: Are the itemised data and purposes in each notice reconciled to the purpose register, with drift flagged when either changes?
    recommendation: Reconcile each notice to the purpose register and add a change trigger so any drift is flagged and fixed before release.
  - control: CTL-NOT-03
    question: Are notices available in English and in the Eighth Schedule languages relevant to the customer base, with a language selector?
    recommendation: Identify the languages your customers use by geography and channel, translate the notices, and add a language selector.
  - control: CTL-NOT-04
    question: Are notices versioned with effective dates, and is the notice version stored with each consent record?
    recommendation: Version every notice with an effective date and record the notice version against each consent in the consent ledger.
  - control: CTL-NOT-05
    question: For consent given before the Act commenced, has the organisation identified the affected data principals and sent them a s.5(2) notice, logging delivery and withdrawals?
    recommendation: Identify the pre-commencement consent base, send the s.5(2) notice through appropriate channels, and log delivery and any withdrawals.

  # D06 Consent
  - control: CTL-CON-01
    question: Is consent captured per purpose, unticked by default, through a clear affirmative action, not bundled with unnecessary purposes and free of dark patterns?
    recommendation: Adopt a consent design standard (granular, unticked, affirmative, unbundled, no dark patterns) and check every journey against a UX checklist.
  - control: CTL-CON-02
    question: Does a consent ledger record, for each consent, the principal, purposes, notice version, channel, timestamp, method, withdrawals and any Consent Manager reference?
    recommendation: Implement a central tamper-evident consent ledger capturing all required attributes so consent can be proved on demand.
  - control: CTL-CON-03
    question: Can data principals withdraw consent as easily as they gave it, on the same channels and in the same or fewer steps, including offline equivalents?
    recommendation: Offer withdrawal on every channel where consent is taken, with the same or fewer steps, including branch, IVR or SMS keyword options.
  - control: CTL-CON-04
    question: Do withdrawals propagate to all downstream systems and processors within a defined SLA, with reconciliation?
    recommendation: Automate withdrawal propagation to systems and processors, define an SLA (for example 48 to 72 hours) and reconcile regularly.
  - control: CTL-CON-05
    question: Where Consent Managers are used, is the organisation integrated with registered Consent Managers (APIs, event handling, reconciliation)?
    recommendation: Plan and build integration with registered Consent Managers, including event handling and reconciliation, ahead of the regime going live.
  - control: CTL-CON-06
    question: Does marketing rely on a separate consent, with SMS and voice sent through DLT-registered headers and templates, DND scrubbing and unsubscribes honoured?
    recommendation: Separate marketing consent from service consent, route messages through DLT-registered headers and templates, scrub against DND and honour unsubscribes promptly.

  # D07 Consent Managers
  - control: CTL-CMO-01
    question: If the organisation is a Consent Manager, does it maintain its registration, net-worth monitoring, fit-and-proper checks, conflict-of-interest policy, disclosures and change-of-control approvals?
    recommendation: Maintain a Consent Manager governance file covering registration conditions, net worth, fit-and-proper checks, conflicts of interest, disclosures and change-of-control approvals.
  - control: CTL-CMO-02
    question: If the organisation is a Consent Manager, does its platform ensure it cannot read the personal data it relays, provide interoperable APIs, keep 7-year records accessible to principals in machine-readable form, avoid sub-contracting and run an ISMS?
    recommendation: Engineer the platform so that personal data it carries cannot be read by the Consent Manager, expose interoperable APIs, keep 7-year machine-readable records, stop any sub-contracting and certify the ISMS.

  # D08 Children & persons with disabilities
  - control: CTL-CHD-01
    question: Is risk-based age assurance applied at onboarding (declaration, signals and verification where the risk is high)?
    recommendation: Introduce a risk-based age gate at onboarding and test it on every channel.
  - control: CTL-CHD-02
    question: Is verifiable parental consent obtained, with the parent's identity and age verified from held records, voluntarily provided details or a DigiLocker or authorised virtual token, and the parent-child link recorded?
    recommendation: Build a verifiable parental consent workflow using one of the Rule 10 methods and record the parent-child link with the evidence of verification.
  - control: CTL-CHD-03
    question: For child accounts, are tracking, behavioural monitoring and targeted advertising switched off at SDK and ad-server level, and is profiling blocked?
    recommendation: Configure child accounts to disable tracking, behavioural monitoring and targeted ads at the technical level, and test the configuration.
  - control: CTL-CHD-04
    question: Where a Fourth Schedule exemption is relied on, is processing limited to the exempted condition and documented in the exemption register?
    recommendation: Limit exempted processing to the Fourth Schedule condition, document it in the exemption register and review it periodically.
  - control: CTL-PWD-01
    question: Before accepting consent from a lawful guardian of a person with a disability, does the organisation verify the guardian's appointment (court order, designated authority or National Trust local level committee)?
    recommendation: Adopt a guardian verification checklist and require proof of appointment before accepting consent on behalf of a person with a disability.

  # D09 Security safeguards
  - control: CTL-SEC-01
    question: Is there an ISMS covering personal-data systems, with an annual risk assessment that considers personal-data impact?
    recommendation: Extend the ISMS to all personal-data systems and add personal-data impact to the annual security risk assessment.
  - control: CTL-SEC-02
    question: Is personal data encrypted at rest (databases, storage, backups, endpoints) and in transit (TLS 1.2 or later), with managed and rotated keys?
    recommendation: Encrypt personal data at rest and in transit and put key management with rotation in place.
  - control: CTL-SEC-03
    question: Are identifiers masked in screens and reports for roles that do not need them, tokenised where appropriate, and masked in non-production environments?
    recommendation: Apply masking and tokenisation for sensitive identifiers (for example Aadhaar, PAN, card and account numbers) and use only masked data outside production.
  - control: CTL-SEC-04
    question: Is access to personal-data systems role-based and least-privilege, with MFA for remote and privileged access, joiner-mover-leaver controls and quarterly access reviews?
    recommendation: Enforce RBAC and least privilege, require MFA for remote and privileged access, automate joiner-mover-leaver steps and review access every quarter.
  - control: CTL-SEC-05
    question: Are privileged credentials vaulted, with session recording for database and administrator access to personal-data stores?
    recommendation: Deploy privileged access management with credential vaulting and session recording for administrative access to personal-data stores.
  - control: CTL-SEC-06
    question: Are access logs for personal-data systems (who accessed which record) centralised in a SIEM, with use cases for bulk export, unusual access and privileged misuse, and reviewed periodically?
    recommendation: Centralise personal-data access logs in the SIEM, build the detection use cases and review alerts on a set schedule.
  - control: CTL-SEC-07
    question: Are logs and relevant personal data kept for at least one year for investigation (Rule 6(1)(e) and Rule 8(3)), and are ICT logs kept for a rolling 180 days in India (CERT-In)?
    recommendation: Set log retention to at least one year for DPDP purposes and 180 days in India for CERT-In, and verify it technically.
  - control: CTL-SEC-08
    question: Are personal-data systems backed up with encrypted backups, tested restores and disaster recovery aligned to RTO and RPO?
    recommendation: Encrypt backups, test restores on a schedule and align disaster recovery with agreed RTO and RPO.
  - control: CTL-SEC-09
    question: Are personal-data systems scanned and patched regularly, with an annual VAPT of internet-facing applications?
    recommendation: Run regular vulnerability scanning and patching and commission an annual VAPT of internet-facing applications.
  - control: CTL-SEC-10
    question: Is data loss prevention in place on email, web, endpoints and USB for personal-data patterns (Aadhaar, PAN, card, health terms), blocking or alerting?
    recommendation: Deploy DLP rules for personal-data patterns across email, web, endpoints and removable media, starting in alert mode and moving to block.
  - control: CTL-SEC-11
    question: Are paper forms and files containing personal data stored securely, with access registers and shredding before and after digitisation?
    recommendation: Provide locked storage and access registers for paper records and shred them securely according to the retention schedule.
  - control: CTL-SEC-12
    question: Does the SDLC include secure coding and privacy test cases, with no unmasked production personal data in development or test?
    recommendation: Add privacy test cases to the SDLC and prohibit unmasked production personal data in non-production environments.
  - control: CTL-SEC-13
    question: Are all ICT systems synchronised to the NIC or NPL NTP servers or another traceable source?
    recommendation: Configure all systems to synchronise time with NIC or NPL NTP servers (or a traceable source) and monitor for drift.
  - control: CTL-SEC-14
    question: Do devices that handle personal data (including field-agent tablets and BYOD) have disk encryption, EDR and mobile device management?
    recommendation: Enforce disk encryption, EDR and MDM on every device that handles personal data, including BYOD and field devices.

  # D10 Breach management
  - control: CTL-BRE-01
    question: Is there an incident response plan with a severity matrix, personal-data breach criteria, all notification clocks (CERT-In 6 hours, Board without delay and within 72 hours, data principals without delay, sector regulators), roles and templates?
    recommendation: Update the incident response plan to include personal-data breach criteria, every regulatory clock, roles and ready-to-use notification templates.
  - control: CTL-BRE-02
    question: Is every incident logged with a personal-data impact assessment, the time the organisation became aware, notification decisions and the time of each notification to regulators and data principals?
    recommendation: Maintain a breach register and decision log capturing awareness time, impact assessment and every notification decision and timestamp.
  - control: CTL-BRE-03
    question: Can the organisation identify affected data principals and notify them at scale (email, SMS, app or letter) within hours, with the content Rule 7(1) requires?
    recommendation: Build the ability to identify affected principals quickly and prepare Rule 7(1) notification templates for each channel; test it in a tabletop.
  - control: CTL-BRE-04
    question: Are breach tabletop exercises held at least annually, including a processor-originated breach and a ransomware scenario?
    recommendation: Run an annual breach tabletop with processor and ransomware scenarios and track the resulting actions to closure.

  # D11 Data principal rights
  - control: CTL-RGT-01
    question: Are rights and grievance channels (web form, app, email, branch, call centre) published with the identifiers required, all routed to a single tracked queue?
    recommendation: Publish rights and grievance channels with the identifiers needed and route every request to one tracked queue.
  - control: CTL-RGT-02
    question: Is there an SOP for each right (access, correction, erasure, nomination, grievance) with an internal SLA well within 90 days, an ageing report and escalation?
    recommendation: Write an SOP per right with an internal SLA well inside the 90-day limit, and add ageing reports and escalation.
  - control: CTL-RGT-03
    question: Are requesters verified using identifiers the organisation issued, and are nominees verified (death certificate or proof of incapacity)?
    recommendation: Define a requester verification method based on identifiers you issue, and a nominee verification checklist.
  - control: CTL-RGT-04
    question: Can the organisation compile, for one data principal, a summary of their data, the processing and the recipients (other fiduciaries and processors) across all systems?
    recommendation: Build identity resolution across systems and an access-request report that summarises data, processing and recipients.
  - control: CTL-RGT-05
    question: Is erasure carried out across systems and processors after checking retention obligations, with any partial erasure explained to the data principal?
    recommendation: Implement an erasure workflow that checks legal holds and retention duties, erases across systems and processors, and explains any partial erasure.

  # D12 Retention & erasure
  - control: CTL-RET-01
    question: Is there a retention schedule per record type and purpose that cites the DPDP position (purpose end, one-year minimum, Third Schedule) and sector, tax and labour laws, with a legal hold process?
    recommendation: Build a reconciled retention schedule citing each legal source, add a legal hold process and get it approved.
  - control: CTL-RET-02
    question: Is personal data deleted or irreversibly anonymised at the end of retention across systems, data lakes, backups (by expiry), archives and logs?
    recommendation: Automate deletion or anonymisation at retention expiry across all stores and keep evidence of each run.
  - control: CTL-RET-03
    question: For Third Schedule classes, does the organisation track each principal's last approach, send the 48-hour notice before erasure and erase at three years of inactivity (excluding account access and wallet tokens)?
    recommendation: Build an inactivity engine that tracks last approach, sends the 48-hour notice and erases after three years, with the Rule 8 exclusions.
  - control: CTL-RET-04
    question: Do processors return or erase personal data at contract end or on instruction, and does the organisation obtain a certificate?
    recommendation: Require return or erasure at contract end or on instruction in every DPA and collect erasure certificates.
  - control: CTL-RET-05
    question: Are paper forms destroyed after digitisation or at the end of retention according to the schedule, with shredding records?
    recommendation: Schedule destruction of paper records after digitisation or retention expiry and keep shredding logs.

  # D13 Processors & third parties
  - control: CTL-TPM-01
    question: Is there an inventory of all third parties receiving personal data with their role, data, purpose, location, sub-processors and criticality?
    recommendation: Build a third-party inventory with role, data, purpose, location, sub-processors and criticality, and keep it current.
  - control: CTL-TPM-02
    question: Is privacy due diligence (risk-tiered questionnaire, certifications, data location, sub-processors) completed before a vendor is contracted?
    recommendation: Make risk-tiered privacy due diligence a mandatory step before contract signature.
  - control: CTL-TPM-03
    question: Does every processor contract include a DPDP data processing agreement (processing on instruction, Rule 6 security, breach notice SLA, cessation on withdrawal, erasure or return, sub-processor approval, audit rights, cross-border limits, help with rights)?
    recommendation: Adopt a standard DPDP DPA and put it in place with every processor, prioritising critical vendors.
  - control: CTL-TPM-04
    question: Are critical vendors reassessed annually, with SOC or ISO reports reviewed and audit rights exercised on a risk basis?
    recommendation: Set an annual reassessment cycle for critical vendors, review their assurance reports and audit high-risk vendors.
  - control: CTL-TPM-05
    question: Does sharing with independent Data Fiduciaries (insurers, banks, group companies, partners) have a basis, disclosure in the notice, a sharing agreement and an accuracy check?
    recommendation: Document the basis for each sharing arrangement, disclose it in notices, sign a sharing agreement and check accuracy before sharing.

  # D14 Cross-border transfers
  - control: CTL-XB-01
    question: Is there a register of cross-border transfers (vendor, country, data, purpose, basis, safeguards) checked against the notified restricted list and sector localisation rules?
    recommendation: Build a transfer register and check it against the government's restricted list and sector localisation requirements whenever either changes.
  - control: CTL-XB-02
    question: Are region pinning and technical controls in place for data that must stay in India (RBI payments, IRDAI, SEBI, government, SDF-specified data and CERT-In logs)?
    recommendation: Pin data that must stay in India to Indian regions and add technical controls that prevent it from leaving.

  # D15 Significant Data Fiduciary
  - control: CTL-SDF-01
    question: If the organisation is a Significant Data Fiduciary, has the Board appointed an India-based DPO who reports to the Board, and an independent data auditor with independence checks?
    recommendation: Pass a Board resolution appointing an India-based DPO reporting to the Board, and appoint an independent data auditor after checking independence.
  - control: CTL-SDF-02
    question: If the organisation is a Significant Data Fiduciary, does it run an annual DPIA and audit cycle and submit a report of significant observations to the Board?
    recommendation: Adopt a DPIA methodology and an annual DPIA and audit cycle, and submit significant observations to the Data Protection Board as Rule 13 requires.
  - control: CTL-SDF-03
    question: If the organisation is a Significant Data Fiduciary, is there an inventory of algorithms and AI models that touch personal data, with an assessment of the risk to data principals' rights?
    recommendation: Inventory algorithmic systems that process personal data and assess and mitigate the risks they pose to data principals' rights.

  # D16 Data quality
  - control: CTL-DQ-01
    question: Where personal data is used to make decisions (credit, eligibility, hiring, claims) or is disclosed to other fiduciaries, are there validation, deduplication and reconciliation rules?
    recommendation: Define data quality rules for data used in decisions or disclosed to others and monitor exceptions.
  - control: CTL-DQ-02
    question: Do corrections made on a data principal's request propagate to all systems and to recipients who received the data?
    recommendation: Propagate corrections to every system and recipient, and record that they were informed.

  # D17 Regulator interface
  - control: CTL-REG-01
    question: Is there a register and SOP for Data Protection Board inquiries, government information calls (Rule 23), law-enforcement requests and confidentiality directions, with response timelines?
    recommendation: Set up a regulator and government request register with an SOP, named owners and response timelines.
  - control: CTL-REG-02
    question: Are voluntary undertakings, Board orders and appeal deadlines (60 days) tracked?
    recommendation: Track undertakings, orders and the 60-day appeal window in a register reviewed by legal.
  - control: CTL-REG-03
    question: Is a CERT-In point of contact designated, with a tested reporting channel?
    recommendation: Designate and register a CERT-In point of contact and test the reporting channel periodically.

  # D18 Special regimes
  - control: CTL-STA-01
    question: For processing under State schemes (s.7(b)), is there a scheme-wise note covering lawful basis, necessity, accuracy, retention, security, intimation and accountability under the Second Schedule?
    recommendation: Prepare a Second Schedule compliance note for each State scheme and review it with the scheme owner.
  - control: CTL-RES-01
    question: Where personal data is processed for research, archiving or statistics under s.17(2)(b), are there a protocol, ethics approval where applicable and de-identification, with no decisions specific to a data principal?
    recommendation: Document a research protocol with Rule 16 safeguards, de-identify data and prohibit decisions about individual data principals.
