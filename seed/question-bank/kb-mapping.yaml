# How each ComplyX template question maps to the DUATF knowledge base.
# Status: AI-drafted mapping (Claude), awaiting legal review by ComplyX.
# Keys are the template codes in templates.yaml. Per question:
#   title        short name used for findings and risks
#   domain       KB domain (D01-D18) the question reports under
#   obligations  KB obligations it evidences: references, penalty tier and phase come from these
#   controls     KB controls it tests: guidance, evidence and the recommendation come from these
#   scoring      yes/no questions only: reversed (Yes is the gap) or informational (not scored)
#   outcomes     choice questions only: the outcome of each option (otherwise informational)
#   options      choice questions only: replaces the workbook's choices where they are wrong
#   note         where the template reference differs from the KB, or how it is scored
#   gates        self-reconciliation: when the named question has one of these answers, this
#                question is marked Not applicable; otherwise it cannot be Not applicable
version: 1
questionnaires:
  TPL-001:
    title: Data Fiduciary
    respondent: organisation
    description: "Organisation-level questions on the DPDP programme of the Data Fiduciary: governance, inventory, notice and consent, children, rights, retention, security, breach, transfers, processors and Significant Data Fiduciary duties."
  TPL-002:
    title: Internal data handlers
    respondent: department
    description: "ComplyX Track B, answered by the department head: the common module every department answers about the personal data it handles (categories, purposes, systems, access, sharing, retention, training), then modules for HR, IT and security, marketing, sales, finance, support, procurement, product, legal, facilities, the vendor lifecycle and education operations (B12, drafted by DUATF, for schools, colleges, universities and other institutions). Each question lists the evidence to ask for."
  TPL-003:
    title: External data handlers
    respondent: vendor
    description: "The vendor questionnaire for each processor or other external recipient, covering the contract, certifications, safeguards, breach reporting, data location and sub-processors."
