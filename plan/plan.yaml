# DUATF coding plan as data. Source: docs/DUATF-Coding-Plan.md.
# `pnpm trace` matches test results to these IDs and writes plan/STATUS.md.
# state: planned (not started) | active (being built, tests gate CI) | done
# source: literal | golden | oracle (computed at test time) | sme (signed scenario) | manual
version: 1
phases:
  - id: C0
    title: Repository and tooling
    release: R0
    reviews: [tech_lead]
    subphases:
      - id: C0.1
        title: Node 22, pnpm, git repository
        state: active
        tests: []
      - id: C0.2
        title: Turborepo, TypeScript, ESLint boundaries, Prettier
        state: active
        tests:
          - id: TC-C0.2-01
            title: A core-* package importing a feature-* package fails lint
            expected: no-restricted-imports error
            source: literal
      - id: C0.3
        title: Vitest, Playwright scaffold, fast-check
        state: active
        tests: []
      - id: C0.4
        title: Traceability harness
        state: active
        tests:
          - id: TC-C0.4-01
            title: Missing result, unknown ID and failure are reported and block the gate
            expected: MISSING, UNTRACED, FAIL; gate blocked
            source: literal
          - id: TC-C0.4-02
            title: Drift, deferred and planned tests are reported without blocking
            expected: DRIFT, DEFERRED, PLANNED; gate passing
            source: literal
      - id: C0.5
        title: Local CI command
        state: active
        tests:
          - id: TC-C0.5-01
            title: pnpm verify on a clean clone exits 0
            expected: exit code 0
            source: manual
            kind: manual

  - id: C1
    title: Infrastructure and database core
    release: R0
    reviews: [architect]
    subphases:
      - id: C1.1
        title: Docker services and validated environment
        state: active
        tests:
          - id: TC-C1.1-01
            title: A missing or invalid env var stops startup with a named error
            expected: EnvError naming each bad variable
            source: literal
      - id: C1.2
        title: Drizzle schema, migrations, codes, row-level security
        state: active
        tests:
          - id: TC-C1.2-01
            title: Migrating an empty database twice gives the same schema and the second run is a no-op
            expected: identical schema fingerprint; 0 migrations applied on re-run
            source: literal
          - id: TC-C1.2-02
            title: A tenant-A session cannot read tenant-B rows
            expected: 0 rows (RLS as the non-owner app role)
            source: literal
          - id: TC-C1.2-03
            title: Code generator gives sequential codes with no duplicates under concurrency
            expected: ACT-ACME-HR-001 first; 50 parallel calls give 50 distinct codes
            source: literal
      - id: C1.3
        title: Outbox and idempotent consumers
        state: active
        tests:
          - id: TC-C1.3-01
            title: An event delivered three times has one side effect
            expected: 1
            source: literal
          - id: TC-C1.3-02
            title: The outbox relay publishes each event once and marks it processed
            expected: published once; processed_at set
            source: literal
      - id: C1.4
        title: Object storage
        state: active
        tests:
          - id: TC-C1.4-01
            title: Upload stores SHA-256; an expired signed URL is refused
            expected: sha256 matches; HTTP 403 after expiry
            source: literal
      - id: C1.5
        title: API health endpoint and web shell on 0.0.0.0
        state: active
        tests:
          - id: TC-C1.5-01
            title: /health reports database, Redis and object storage up
            expected: HTTP 200 with all three up
            source: literal
          - id: TC-C1.5-02
            title: Web and API are reachable from another LAN machine
            expected: HTTP 200 from 192.168.0.110:53000 and :54000/health
            source: manual
            kind: manual

  - id: C2
    title: Framework in the database
    release: R0
    reviews: [legal_sme, tech_lead]
    subphases:
      - id: C2.1
        title: Framework schema
        state: active
        tests: []
      - id: C2.2
        title: One-time seed import (release 1.0.0)
        state: active
        tests:
          - id: TC-C2.2-01
            title: Release 1.0.0 row counts equal the counts in the seed
            expected: equal per type
            source: oracle
          - id: TC-C2.2-02
            title: Obligation-control links are complete and consistent
            expected: every obligation >= 1 control, every control >= 1 obligation, 0 dangling
            source: literal
          - id: TC-C2.2-03
            title: Obligation profile by actor and phase equals the seed
            expected: equal distributions
            source: oracle
          - id: TC-C2.2-04
            title: Importing again is refused
            expected: AlreadyImportedError
            source: literal
          - id: TC-C2.2-05
            title: Every cross-reference stored in note bodies resolves to a framework record
            expected: 0 unresolved references
            source: literal
          - id: TC-C2.2-06
            title: '[drift] Seed counts equal the plan snapshot of 29 Sep 2026'
            expected: 44 sections, 23 rules, 8 schedules, 19 bases, 18 domains, 99 obligations, 82 controls, 124 templates, 20 overlays, 91 data elements, 17 vocabularies, 34 PBC items, 25 stuck points
            source: literal
      - id: C2.3
        title: Release lifecycle and immutability
        state: active
        tests:
          - id: TC-C2.3-01
            title: Changing rows of a published release fails at database level
            expected: exception on insert, update and delete
            source: literal
      - id: C2.4
        title: v0.2 seed patches (release 1.1.0 draft)
        state: planned
        tests:
          - id: TC-C2.4-01
            title: Every obligation has anchor level, tier and track
            expected: 100%
            source: literal
          - id: TC-C2.4-02
            title: Core obligations have 3-6 criteria mapped to controls
            expected: 100%
            source: literal
          - id: TC-C2.4-03
            title: LNK-SPDI-01 live on 12 May 2027, not on 13 May 2027
            expected: true, false
            source: literal
          - id: TC-C2.4-04
            title: Interpretation Log has 6 entries with position and review date
            expected: 6
            source: literal
      - id: C2.5
        title: Framework library API and UI
        state: active
        tests:
          - id: TC-C2.5-01
            title: The editor of a draft cannot publish it
            expected: HTTP 403
            source: literal
            deferredTo: C3
          - id: TC-C2.5-02
            title: Obligation detail returns its controls, instruments and trigger as recorded in the seed
            expected: OBL-CON-01 with CTL-LB-02, CTL-LB-04, CTL-CON-01, CTL-CON-06
            source: oracle
          - id: TC-C2.5-03
            title: Triggers are described in plain English
            expected: literal cases
            source: literal
          - id: TC-C2.5-04
            title: Search finds obligations and law by code, citation and words
            expected: '"Rule 7" finds R07 and OBL-BRE-*'
            source: literal
          - id: TC-C2.5-05
            title: In-force counts by date equal the seed
            expected: 7 on 2026-09-30, 13 on 2026-11-13, 99 on 2027-05-13
            source: oracle

  - id: C3
    title: 'Identity and access'
    release: R0
    reviews: [security]
    subphases:
      - id: C3.1
        title: 'Keycloak realm, clients, password policy, MFA'
        state: active
        tests:
          - id: TC-C3.1-01
            title: 'Realm setup is idempotent and the issuer is the LAN URL of realm duatf'
            expected: 'same realm and clients after two runs; issuer http://192.168.0.110:58080/realms/duatf'
            source: literal
      - id: C3.2
        title: 'OIDC login and logout, server-side sessions'
        state: active
        tests:
          - id: TC-C3.2-01
            title: 'Sessions are stored only as hashes; expired or revoked sessions are refused'
            expected: 'no raw token stored; expired and revoked refused'
            source: literal
          - id: TC-C3.2-02
            title: 'The login callback rejects a mismatched state'
            expected: 'callback refused'
            source: literal
      - id: C3.3
        title: 'Roles, permission matrix, client and department scoping'
        state: active
        tests:
          - id: TC-C3.3-01
            title: 'Every role x capability equals the documented matrix'
            expected: '100% match'
            source: golden
          - id: TC-C3.3-02
            title: 'Auditor refused on an unassigned client; department owner refused outside their department'
            expected: 'refused'
            source: literal
          - id: TC-C3.3-03
            title: "A client user can never read another client's rows (RLS)"
            expected: '0 rows'
            source: literal
      - id: C3.4
        title: 'Hash-chained audit log'
        state: active
        tests:
          - id: TC-C3.4-01
            title: 'Tampering with one audit row breaks verification at that row'
            expected: 'failure at the tampered row'
            source: literal
      - id: C3.5
        title: 'App shell, role-aware navigation, first admin'
        state: active
        tests:
          - id: TC-C3.5-01
            title: 'Login through Keycloak from a LAN machine lands on the role home page'
            expected: 'signed in'
            source: manual
            kind: manual

  - id: C4
    title: 'Knowledge base and question bank'
    release: R1
    reviews: [legal_sme]
    subphases:
      - id: C4.1
        title: 'Single knowledge-base page'
        state: active
        tests:
          - id: TC-C4.1-01
            title: 'Every knowledge-base section returns items and any item resolves by code'
            expected: 'all sections non-empty; items resolve'
            source: oracle
      - id: C4.2
        title: 'Release 1.1.0 with question bank and SPDI sunset'
        state: active
        tests:
          - id: TC-C4.2-01
            title: 'Release 1.1.0 carries every 1.0.0 row unchanged'
            expected: 'equal counts per table'
            source: oracle
          - id: TC-C4.2-02
            title: 'One question per control, each with references, evidence and a recommendation'
            expected: 'questions = controls, all complete'
            source: oracle
          - id: TC-C4.2-03
            title: 'LNK-SPDI-01 live on 12 May 2027, not on 13 May 2027'
            expected: 'true, false'
            source: literal
      - id: C4.3
        title: 'Evidence suggestions'
        state: active
        tests:
          - id: TC-C4.3-01
            title: 'Suggestions are split into required, recommended and supporting with no duplicates'
            expected: 'three disjoint lists'
            source: literal

  - id: C5
    title: 'Clients and organisation'
    release: R1
    reviews: [lead_auditor]
    subphases:
      - id: C5.1
        title: 'Client onboarding'
        state: planned
        tests:
          - id: TC-C5.1-01
            title: 'Onboarding validates required fields and gives a unique client code'
            expected: 'field errors; unique code'
            source: literal
      - id: C5.2
        title: 'Departments'
        state: planned
        tests:
          - id: TC-C5.2-01
            title: 'Department codes are unique within a client'
            expected: 'duplicate refused'
            source: literal
      - id: C5.3
        title: 'Client users and invitations'
        state: planned
        tests:
          - id: TC-C5.3-01
            title: 'Inviting creates one app user with a role scoped to the client; a repeat invite does not duplicate'
            expected: '1 user, 1 role'
            source: literal
      - id: C5.4
        title: 'Firm staff assignment'
        state: planned
        tests:
          - id: TC-C5.4-01
            title: 'Firm admin sees all clients; auditor sees assigned clients only'
            expected: 'filtered lists'
            source: literal

  - id: C6
    title: 'Assessment execution'
    release: R1
    reviews: [lead_auditor]
    subphases:
      - id: C6.1
        title: 'Assessment cycles'
        state: planned
        tests:
          - id: TC-C6.1-01
            title: 'A new assessment pins the release and creates one item per question'
            expected: 'items = questions'
            source: oracle
      - id: C6.2
        title: 'Items and department assignment'
        state: planned
        tests:
          - id: TC-C6.2-01
            title: "A department owner can answer only their department's items"
            expected: 'refused elsewhere'
            source: literal
      - id: C6.3
        title: 'Answers'
        state: planned
        tests:
          - id: TC-C6.3-01
            title: 'Not applicable needs a reason; answers map to compliance states'
            expected: 'mapping holds'
            source: literal
      - id: C6.4
        title: 'Review and progress'
        state: planned
        tests:
          - id: TC-C6.4-01
            title: 'Progress and compliance percentages equal the fixture'
            expected: 'fixture values'
            source: golden

  - id: C7
    title: 'Evidence'
    release: R1
    reviews: [lead_auditor]
    subphases:
      - id: C7.1
        title: 'Upload and storage'
        state: planned
        tests:
          - id: TC-C7.1-01
            title: 'Upload stores SHA-256; downloads only via a short-lived link for authorised users'
            expected: 'hash matches; unauthorised refused'
            source: literal
      - id: C7.2
        title: 'Links to items, findings and actions'
        state: planned
        tests:
          - id: TC-C7.2-01
            title: 'One evidence item links to several questions'
            expected: 'shown on each'
            source: literal
      - id: C7.3
        title: 'Review and expiry'
        state: planned
        tests:
          - id: TC-C7.3-01
            title: 'Accept or reject needs a reviewer other than the uploader'
            expected: 'uploader refused'
            source: literal
      - id: C7.4
        title: 'Evidence repository'
        state: planned
        tests: []

  - id: C8
    title: 'Findings, gaps and risks'
    release: R1
    reviews: [legal_sme, lead_auditor]
    subphases:
      - id: C8.1
        title: 'Gap rules and findings'
        state: planned
        tests:
          - id: TC-C8.1-01
            title: 'No opens exactly one finding; Yes closes it with history'
            expected: '1 open, then closed'
            source: literal
      - id: C8.2
        title: 'Risk register and scoring'
        state: planned
        tests:
          - id: TC-C8.2-01
            title: 'Score = L x I with configurable bands'
            expected: '4 Low, 5 Medium, 9 Medium, 10 High, 16 High, 17 Critical, 25 Critical'
            source: literal
      - id: C8.3
        title: 'Recommendations from the knowledge base'
        state: planned
        tests:
          - id: TC-C8.3-01
            title: "A finding carries its question's recommendation and references"
            expected: 'present'
            source: oracle

  - id: C9
    title: 'Remediation and re-assessment'
    release: R2
    reviews: [lead_auditor]
    subphases:
      - id: C9.1
        title: 'Actions'
        state: planned
        tests:
          - id: TC-C9.1-01
            title: 'Only allowed status transitions are accepted'
            expected: 'invalid refused'
            source: literal
      - id: C9.2
        title: 'Verification'
        state: planned
        tests:
          - id: TC-C9.2-01
            title: 'Closing without evidence or by the owner is refused'
            expected: 'refused'
            source: literal
      - id: C9.3
        title: 'Re-assessment'
        state: planned
        tests:
          - id: TC-C9.3-01
            title: 'A re-assessment copies scope and links to the previous cycle'
            expected: 'copied and linked'
            source: literal

  - id: C10
    title: 'Dashboards and client sharing'
    release: R2
    reviews: [lead_auditor]
    subphases:
      - id: C10.1
        title: 'Firm portfolio dashboard'
        state: planned
        tests:
          - id: TC-C10.1-01
            title: 'Dashboard figures equal direct counts'
            expected: 'equal'
            source: oracle
      - id: C10.2
        title: 'Client dashboard and portal'
        state: planned
        tests:
          - id: TC-C10.2-01
            title: 'A client user is sent to their own client and cannot open another'
            expected: 'redirected; refused'
            source: literal

  - id: C11
    title: 'Reports'
    release: R2
    reviews: [legal_sme]
    subphases:
      - id: C11.1
        title: 'Excel exports'
        state: planned
        tests:
          - id: TC-C11.1-01
            title: 'Risk-register workbook has one row per risk with every column'
            expected: 'rows = risks'
            source: oracle
      - id: C11.2
        title: 'Printable reports'
        state: planned
        tests:
          - id: TC-C11.2-01
            title: 'Executive report shows required sections, release and date'
            expected: 'present'
            source: literal

  - id: C12
    title: 'Hardening'
    release: R3
    reviews: [security]
    subphases:
      - id: C12.1
        title: 'Isolation, load, restore, ClamAV, accessibility'
        state: planned
        tests:
          - id: TC-C12-01
            title: 'No cross-tenant access across all routes'
            expected: '0'
            source: literal
          - id: TC-C12-02
            title: 'API p95 under load'
            expected: 'under 300 ms at 50 users'
            source: literal
          - id: TC-C12-03
            title: 'Restore drill'
            expected: 'under 4 h; audit chain verifies'
            source: literal

  - id: C13
    title: 'Pilots and production'
    release: R3
    reviews: [leadership]
    subphases:
      - id: C13.1
        title: 'Production profile, pilots, 1.0'
        state: planned
        tests:
          - id: TC-C13-01
            title: 'Pilot findings per root cause'
            expected: 'at most 1.2'
            source: literal
          - id: TC-C13-02
            title: 'UAT sign-off'
            expected: 'signed'
            source: manual
            kind: manual

  - id: C14
    title: 'ROPA, data inventory and DIA (V2)'
    release: R3
    reviews: [legal_sme]
    subphases:
      - id: C14.1
        title: 'Processing activities, ROPA, DIA, applicability engine'
        state: planned
        tests:
          - id: TC-C14-01
            title: 'DemoPay applicable counts on release 1.0.0 equal the Python engine'
            expected: '46, 67, 63, 54, 64, 67'
            source: oracle

  - id: C15
    title: 'Vendors (V3)'
    release: R3
    reviews: [lead_auditor]
    subphases:
      - id: C15.1
        title: 'Vendor register, questionnaire, risk'
        state: planned
        tests: []
