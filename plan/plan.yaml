# DUATF coding plan as data. Source: docs/DUATF-Coding-Plan.md.
# `pnpm trace` matches test results to these IDs and writes plan/STATUS.md.
# state: planned (not started) | active (being built, tests gate CI) | done
# source: literal | golden | oracle (computed at test time) | sme (signed scenario) | manual
version: 1
phases:
  - id: C0
    title: Repository and tooling
    release: R0
    reviews: [tech_lead]
    subphases:
      - id: C0.1
        title: Node 22, pnpm, git repository
        state: active
        tests: []
      - id: C0.2
        title: Turborepo, TypeScript, ESLint boundaries, Prettier
        state: active
        tests:
          - id: TC-C0.2-01
            title: A core-* package importing a feature-* package fails lint
            expected: no-restricted-imports error
            source: literal
      - id: C0.3
        title: Vitest, Playwright scaffold, fast-check
        state: active
        tests: []
      - id: C0.4
        title: Traceability harness
        state: active
        tests:
          - id: TC-C0.4-01
            title: Missing result, unknown ID and failure are reported and block the gate
            expected: MISSING, UNTRACED, FAIL; gate blocked
            source: literal
          - id: TC-C0.4-02
            title: Drift, deferred and planned tests are reported without blocking
            expected: DRIFT, DEFERRED, PLANNED; gate passing
            source: literal
      - id: C0.5
        title: Local CI command
        state: active
        tests:
          - id: TC-C0.5-01
            title: pnpm verify on a clean clone exits 0
            expected: exit code 0
            source: manual
            kind: manual

  - id: C1
    title: Infrastructure and database core
    release: R0
    reviews: [architect]
    subphases:
      - id: C1.1
        title: Docker services and validated environment
        state: active
        tests:
          - id: TC-C1.1-01
            title: A missing or invalid env var stops startup with a named error
            expected: EnvError naming each bad variable
            source: literal
      - id: C1.2
        title: Drizzle schema, migrations, codes, row-level security
        state: active
        tests:
          - id: TC-C1.2-01
            title: Migrating an empty database twice gives the same schema and the second run is a no-op
            expected: identical schema fingerprint; 0 migrations applied on re-run
            source: literal
          - id: TC-C1.2-02
            title: A tenant-A session cannot read tenant-B rows
            expected: 0 rows (RLS as the non-owner app role)
            source: literal
          - id: TC-C1.2-03
            title: Code generator gives sequential codes with no duplicates under concurrency
            expected: ACT-ACME-HR-001 first; 50 parallel calls give 50 distinct codes
            source: literal
      - id: C1.3
        title: Outbox and idempotent consumers
        state: active
        tests:
          - id: TC-C1.3-01
            title: An event delivered three times has one side effect
            expected: 1
            source: literal
          - id: TC-C1.3-02
            title: The outbox relay publishes each event once and marks it processed
            expected: published once; processed_at set
            source: literal
      - id: C1.4
        title: Object storage
        state: active
        tests:
          - id: TC-C1.4-01
            title: Upload stores SHA-256; an expired signed URL is refused
            expected: sha256 matches; HTTP 403 after expiry
            source: literal
      - id: C1.5
        title: API health endpoint and web shell on 0.0.0.0
        state: active
        tests:
          - id: TC-C1.5-01
            title: /health reports database, Redis and object storage up
            expected: HTTP 200 with all three up
            source: literal
          - id: TC-C1.5-02
            title: Web and API are reachable from another LAN machine
            expected: HTTP 200 from 192.168.0.110:53000 and :54000/health
            source: manual
            kind: manual

  - id: C2
    title: Framework in the database
    release: R0
    reviews: [legal_sme, tech_lead]
    subphases:
      - id: C2.1
        title: Framework schema
        state: active
        tests: []
      - id: C2.2
        title: One-time seed import (release 1.0.0)
        state: active
        tests:
          - id: TC-C2.2-01
            title: Release 1.0.0 row counts equal the counts in the seed
            expected: equal per type
            source: oracle
          - id: TC-C2.2-02
            title: Obligation-control links are complete and consistent
            expected: every obligation >= 1 control, every control >= 1 obligation, 0 dangling
            source: literal
          - id: TC-C2.2-03
            title: Obligation profile by actor and phase equals the seed
            expected: equal distributions
            source: oracle
          - id: TC-C2.2-04
            title: Importing again is refused
            expected: AlreadyImportedError
            source: literal
          - id: TC-C2.2-05
            title: Every cross-reference stored in note bodies resolves to a framework record
            expected: 0 unresolved references
            source: literal
          - id: TC-C2.2-06
            title: '[drift] Seed counts equal the plan snapshot of 29 Sep 2026'
            expected: 44 sections, 23 rules, 8 schedules, 19 bases, 18 domains, 99 obligations, 82 controls, 124 templates, 20 overlays, 91 data elements, 17 vocabularies, 34 PBC items, 25 stuck points
            source: literal
      - id: C2.3
        title: Release lifecycle and immutability
        state: active
        tests:
          - id: TC-C2.3-01
            title: Changing rows of a published release fails at database level
            expected: exception on insert, update and delete
            source: literal
      - id: C2.4
        title: v0.2 seed patches (release 1.1.0 draft)
        state: planned
        tests:
          - id: TC-C2.4-01
            title: Every obligation has anchor level, tier and track
            expected: 100%
            source: literal
          - id: TC-C2.4-02
            title: Core obligations have 3-6 criteria mapped to controls
            expected: 100%
            source: literal
          - id: TC-C2.4-03
            title: LNK-SPDI-01 live on 12 May 2027, not on 13 May 2027
            expected: true, false
            source: literal
          - id: TC-C2.4-04
            title: Interpretation Log has 6 entries with position and review date
            expected: 6
            source: literal
      - id: C2.5
        title: Framework library API and UI
        state: active
        tests:
          - id: TC-C2.5-01
            title: The editor of a draft cannot publish it
            expected: HTTP 403
            source: literal
            deferredTo: C3
          - id: TC-C2.5-02
            title: Obligation detail returns its controls, instruments and trigger as recorded in the seed
            expected: OBL-CON-01 with CTL-LB-02, CTL-LB-04, CTL-CON-01, CTL-CON-06
            source: oracle
          - id: TC-C2.5-03
            title: Triggers are described in plain English
            expected: literal cases
            source: literal
          - id: TC-C2.5-04
            title: Search finds obligations and law by code, citation and words
            expected: '"Rule 7" finds R07 and OBL-BRE-*'
            source: literal
          - id: TC-C2.5-05
            title: In-force counts by date equal the seed
            expected: 7 on 2026-09-30, 13 on 2026-11-13, 99 on 2027-05-13
            source: oracle

  - id: C3
    title: 'Identity and access'
    release: R0
    reviews: [security]
    subphases:
      - id: C3.1
        title: 'Keycloak realm, clients, password policy, MFA (multi-view edition)'
        state: active
        tests:
          - id: TC-C3.1-01
            title: 'Realm setup is idempotent and the issuer is the LAN URL of realm duatf'
            expected: 'same realm and clients after two runs; issuer http://192.168.0.110:58080/realms/duatf'
            source: literal
            deferredTo: multi-view
      - id: C3.2
        title: "Sign-in with username and password on DUATF's own page, server-side sessions"
        state: active
        tests:
          - id: TC-C3.2-01
            title: 'Sessions are stored only as hashes; expired or revoked sessions, and people without a login, are refused'
            expected: 'no raw token stored; expired, revoked, disabled and no-login refused'
            source: literal
          - id: TC-C3.2-02
            title: 'Sign-in needs the right password of an enabled login and locks after five failures for 15 minutes'
            expected: 'same answer for a wrong password and an unknown name; locked; open again after 15 minutes; revoked login refused'
            source: literal
      - id: C3.3
        title: 'Roles, permission matrix, client and department scoping'
        state: active
        tests:
          - id: TC-C3.3-01
            title: 'Every role x capability equals the documented matrix'
            expected: '100% match'
            source: golden
          - id: TC-C3.3-02
            title: 'Auditor refused on an unassigned client; department owner refused outside their department'
            expected: 'refused'
            source: literal
          - id: TC-C3.3-03
            title: "A client user can never read another client's rows (RLS)"
            expected: '0 rows'
            source: literal
      - id: C3.4
        title: 'Hash-chained audit log'
        state: active
        tests:
          - id: TC-C3.4-01
            title: 'Tampering with one audit row breaks verification at that row'
            expected: 'failure at the tampered row'
            source: literal
      - id: C3.5
        title: 'App shell, role-aware navigation, first admin'
        state: active
        tests:
          - id: TC-C3.5-01
            title: 'Signing in on the DUATF sign-in page from a LAN machine and changing the one-time password lands on the role home page'
            expected: 'signed in'
            source: manual
            kind: manual

