        tests:
          - id: TC-C3.2-01
            title: Permission matrix enforced for every role and capability
            expected: 100% match
            source: golden
          - id: TC-C3.2-02
            title: Preparer approving own item is refused and audited
            expected: HTTP 403 + audit entry
            source: literal
      - id: C3.3
        title: Hash-chained audit log
        state: planned
        tests:
          - id: TC-C3.3-01
            title: Tampering one audit row breaks chain verification at that row
            expected: failure at the tampered row
            source: literal
      - id: C3.4
        title: Notifications
        state: planned
        tests: []
      - id: C3.5
        title: Web shell with login and tenant switcher
        state: planned
        tests:
          - id: TC-C3.5-01
            title: Sign in, switch tenant, see only that tenant's data
            expected: E2E pass
            source: literal

